<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Segmentation Tool</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1f8;
      color: #222;
    }

    header {
      background: #3f3151;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .toolbar {
      padding: 15px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button,
    .file-label {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      background: #6f5a83;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover,
    .file-label:hover {
      background: #574466;
    }

    #fileInput {
      display: none;
    }

    .workspace {
      height: calc(100vh - 150px);
      min-height: 500px;
      background: #dedbe3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome {
      text-align: center;
      max-width: 500px;
      padding: 30px;
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .welcome p {
      color: #555;
      line-height: 1.6;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dental 3D Segmentation Tool</h1>
    <p>Open-source workspace for dental scans and orthodontic setup</p>
  </header>

  <div class="toolbar">

    <label class="file-label" for="fileInput">
      📂 Load Dental Scan
    </label>

    <input
      type="file"
      id="fileInput"
      accept=".stl,.ply,.obj"
    >

    <button onclick="resetView()">Reset View</button>

    <button onclick="showAbout()">About</button>

  </div>

  <div class="workspace" id="viewer">

    <div class="welcome">
      <h2>Dental 3D Workspace</h2>

      <p>
        Load an STL, PLY or OBJ dental scan to begin.
      </p>

      <p>
        Future versions will include tooth segmentation,
        FDI numbering, individual tooth export,
        tooth movement and orthodontic staging.
      </p>
    </div>

  </div>

  <script>

    const fileInput = document.getElementById("fileInput");

    fileInput.addEventListener("change", function () {

      if (this.files.length > 0) {

        const file = this.files[0];

        document.querySelector(".welcome").innerHTML = `
          <h2>Scan Loaded</h2>
          <p><strong>${file.name}</strong></p>
          <p>3D viewer connection will be added in the next step.</p>
        `;

      }

    });

    function resetView() {
      alert("3D view reset will be added in the next version.");
    }

    function showAbout() {
      alert(
        "Dental 3D Segmentation Tool\\n\\n" +
        "An open-source project for dental scan segmentation " +
        "and orthodontic setup."
      );
    }

  </script>

</body>
</html>
